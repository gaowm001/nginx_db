<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NGXDB 权限管理控制台</title>
<link rel="stylesheet" href="assets/suite.css?v=10">
<script>
  /* 预应用主题，避免闪烁 */
  (function(){try{var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo" id="brand-logo"></div>
      <div><b>NGXDB</b><span>权限管理控制台</span></div>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__foot">NGXDB Admin · 零依赖</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" id="burger" aria-label="菜单"></button>
      <div class="topbar__title" id="topbar-title">NGXDB</div>
      <div class="topbar__spacer"></div>
      <button class="icon-btn" id="btn-theme" title="切换主题"></button>
      <div class="userchip" id="userchip">
        <div class="avatar" id="avatar">A</div>
        <div>
          <div class="userchip__name" id="uc-name">—</div>
          <div class="userchip__org" id="uc-org">—</div>
        </div>
        <div class="menu" id="user-menu">
          <a id="menu-profile"></a>
          <a id="menu-pass"></a>
          <hr>
          <a class="danger" id="menu-logout"></a>
        </div>
      </div>
    </header>
    <div class="content" id="content"><div class="spinner"></div></div>
  </div>
  <div class="backdrop" id="backdrop"></div>
</div>
<script src="assets/modules.js?v=10"></script>
<script src="assets/core.js?v=10"></script>
<script src="assets/app.js?v=10"></script>
</body>
</html>

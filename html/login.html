<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · NGXDB 权限管理控制台</title>
<link rel="stylesheet" href="assets/suite.css?v=7">
<script>
  (function(){try{var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>
<div class="auth">
  <button class="icon-btn auth__theme" id="theme" title="切换主题"></button>
  <div class="auth__card">
    <div class="auth__hero">
      <div class="auth__logo" id="logo"></div>
      <h1>NGXDB<br>权限管理控制台</h1>
      <p>统一管理系统、部门、角色、员工与权限的现代化管理界面。零依赖、开箱即用，重启后稳定可用。</p>
      <ul class="auth__features">
        <li data-f="shield">细粒度权限与动作控制</li>
        <li data-f="users">员工 / 部门 / 角色管理</li>
        <li data-f="list">系统日志与错误代码查询</li>
      </ul>
    </div>
    <div class="auth__form">
      <h2>欢迎回来</h2>
      <div class="sub">请使用管理员账号登录</div>
      <div class="alert alert--err" id="alert"></div>
      <div class="field">
        <label>用户账号</label>
        <input class="input" id="login-username" type="text" autocomplete="username" value="admin" placeholder="请输入登录账号">
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <div class="field" id="remember-row">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--text)">
          <input type="checkbox" id="remember-pass" style="width:15px;height:15px;margin:0;accent-color:var(--primary)">
          记住密码
          <span style="font-weight:400;color:var(--muted);font-size:12px">（加密保存在本机，建议仅个人电脑使用）</span>
        </label>
      </div>
      <button class="btn btn--primary" id="btn-login" style="justify-content:center;padding:11px">登录</button>
      <div class="auth__hint">NGXDB Admin Suite · 零依赖前端</div>
    </div>
  </div>
</div>
<script src="assets/core.js?v=8"></script>
<script>
(function(){
  /* 主题 */
  var THEME=Store.get('theme')||'light';
  var tb=$('#theme');
  function paintTheme(){document.documentElement.setAttribute('data-theme',THEME);tb.innerHTML=icon(THEME==='dark'?'sun':'moon',18);}
  paintTheme();
  tb.addEventListener('click',function(){THEME=THEME==='dark'?'light':'dark';Store.set('theme',THEME);paintTheme();});
  /* 左侧图标 */
  $('#logo').innerHTML=icon('shield',26);
  $$('[data-f]').forEach(function(el){el.innerHTML=icon(el.getAttribute('data-f'),17)+'<span>'+el.textContent+'</span>';});

  var form=$('#login-password');
  form.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  var uname=$('#login-username');
  uname.addEventListener('keydown',function(e){if(e.key==='Enter')form.focus();});
  $('#btn-login').addEventListener('click',doLogin);

  /* ===== 记住密码：Web Crypto AES-GCM 加密后存本机 localStorage =====
   * - 口令不落明文：随机 256 位密钥 + 随机 IV 加密后存储，防止明文直读/截图/日志泄露；
   * - 密钥与密文同存本机，可防“随手翻看”，但防不了本机恶意脚本——共享电脑、
   *   等保三级（要求双因素）等场景请勿勾选；
   * - 仅在登录成功后写入（确保保存的是有效凭据），取消勾选即清除。 */
  var RK='ngxdb_rmk',RC='ngxdb_rpc';
  var rememberBox=$('#remember-pass');
  var cryptoOK=!!(window.crypto&&crypto.subtle&&rememberBox&&window.btoa&&window.atob&&window.TextEncoder&&window.TextDecoder);
  var _key=null;
  function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
  function unb64(s){var t=atob(s),a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a;}
  function getKey(){
    if(_key)return Promise.resolve(_key);
    var raw=Store.get(RK);
    if(!raw){raw=b64(crypto.getRandomValues(new Uint8Array(32)));Store.set(RK,raw);}
    return crypto.subtle.importKey('raw',unb64(raw),{name:'AES-GCM'},false,['encrypt','decrypt']).then(function(k){_key=k;return k;});
  }
  function saveCred(u,p){
    return getKey().then(function(k){
      var iv=crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify({u:u,p:p}))).then(function(ct){
        Store.set(RC,b64(iv)+'.'+b64(ct));
      });
    });
  }
  function loadCred(){
    var v=Store.get(RC);
    if(!v||v.indexOf('.')<0)return Promise.resolve(null);
    var parts=v.split('.');
    return getKey().then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(parts[0])},k,unb64(parts[1]));
    }).then(function(pt){
      var o;try{o=JSON.parse(new TextDecoder().decode(pt));}catch(e){return null;}
      return (o&&o.u&&o.p)?o:null;
    }).catch(function(){clearCred();return null;});
  }
  function clearCred(){Store.del(RC);Store.del(RK);}
  if(cryptoOK){ /* 打开登录页：回填已保存的账号与密码 */
    loadCred().then(function(o){ if(o){uname.value=o.u;form.value=o.p;rememberBox.checked=true;} });
  }else if(rememberBox){ /* 非 HTTPS/老浏览器无 Web Crypto：隐藏该功能 */
    rememberBox.closest('.field').style.display='none';
  }

  function showAlert(msg){var a=$('#alert');a.textContent=msg||'登录失败';a.classList.add('show');}
  function hideAlert(){var a=$('#alert');a.classList.remove('show');}

  function doLogin(){
    var u=uname.value.trim(),p=form.value;
    hideAlert();
    if(!u){showAlert('请输入登录账号');uname.focus();return;}
    if(!p){showAlert('请输入密码');form.focus();return;}
    var b=$('#btn-login');b.disabled=true;b.innerHTML=icon('refresh',16)+'登录中…';
    /* ✅ nginx postgres 模块“请求体未读全就处理”的缺陷已在 C 层修复
       （见 rebuild_nginx.sh / ngx_http_postgres_module.c），恢复使用 POST：
       口令不再出现在 URL / access.log。并保留鉴权抖动退避重试。 */
    var attempt=0,MAX=3;
    function done(){b.disabled=false;b.innerHTML='登录';}
    function tryLogin(){
      fetch(API_BASE+'sysinfo/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:toFormData({loginname:u,pass:p,system:SYS.systemid})})
      .then(function(r){return r.json();}).then(function(j){
        if(j.errorcode===0){
          var info=j.info||{};
          Store.set('token',info.token||'');
          Store.set('actions',(info.actions||[]).join(','));
          Store.set('operator',JSON.stringify(info.operator||{}));
          /* 登录成功：若带 redirect（会话失效前所在页面）则原路返回，否则进入首页。
             仅接受同源绝对路径(以 / 开头且不含 //)，避免开放重定向。 */
          var rd='';
          try{ rd=new URLSearchParams(location.search).get('redirect')||''; }catch(e){}
          if(!rd||rd.charAt(0)!=='/'||rd.indexOf('//')>=0){ rd='index.html'; }
          /* 记住密码：仅登录成功后保存（确保存的是有效凭据）；未勾选则清除旧存 */
          var go=function(){ location.href=(typeof withTs==='function')?withTs(rd):rd; };
          if(cryptoOK){
            if(rememberBox.checked){ saveCred(u,p).catch(function(){}).then(go); return; }
            clearCred();
          }
          go();
          return;
        }
        if((j.errorcode===100005||j.errorcode===100011||j.errorcode===100012)&&attempt<MAX){attempt++;setTimeout(tryLogin,300);return;}
        done();showAlert(j.message||'账号或密码错误');
      }).catch(function(){
        if(attempt<MAX){attempt++;setTimeout(tryLogin,300);return;}
        done();showAlert('无法连接服务器，请稍后重试');
      });
    }
    tryLogin();
  }
  uname.focus();
})();
</script>
</body>
</html>
